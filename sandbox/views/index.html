<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0 auto;
        padding: 40px 20px;
        max-width: 600px;
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
      }
      form {
        background: #fafafa;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      label {
        display: block;
        margin-bottom: 20px;
        color: #333;
        font-weight: 500;
      }
      input[type="text"] {
        display: block;
        width: 100%;
        padding: 10px 12px;
        margin-top: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: #3498db;
      }
      button {
        background-color: #f3f3f3;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.2s;
        margin-top: 10px;
      }
      button:hover {
        background-color: #e8e8e8;
      }
    </style>
  </head>
  <body>
    <h1>Choose a Report to Display</h1>
    <form action="/api-report" method="get">
      <label>
        Session ID:
        <input type="text" name="session_id" placeholder="Enter session ID" required>
      </label>
      <label>
        User ID:
        <input type="text" name="user_id" placeholder="Enter user ID" required>
      </label>
      <button type="submit">Load Report</button>
    </form>
  </body>
</html>
