<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0 auto;
        padding: 20px;
        max-width: 1200px;
      }
      button {
        background-color: #f3f3f3;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.2s;
      }
      button:hover {
        background-color: #e8e8e8;
      }
    </style>
  </head>
  <body>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
      <h1 style="margin:0;">Reports Page</h1>
      <button type="button" onclick="(function(){ var params = new URLSearchParams(window.location.search); params.set('type', 'feedback'); window.location.href = `/loading?${params.toString()}`; })()">Generate feedback</button>
    </div>
    <div class="reports-layout">
      <div id="reports-container">
        <span class="learnosity-report" id="session-detail"></span>
      </div>
    </div>
    <script src="https://reports.learnosity.com?latest-lts"></script>
    <script>
      var reportsApp = LearnosityReports.init({{ generated_request }});
    </script>
    
  </body>
</html>
